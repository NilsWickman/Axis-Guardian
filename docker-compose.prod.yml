version: '3.8'

# Production docker-compose for nginx reverse proxy
# Requires environment variables:
#   - VPS_PUBLIC_IP: Public IP for WebRTC (e.g., 203.0.113.10)

services:
  frontend:
    image: axis-guardian-frontend:latest
    container_name: axis-guardian-frontend
    restart: unless-stopped
    networks:
      - axis-guardian
    # Internal port 80, nginx will proxy to this

  tracking-service:
    image: axis-guardian-tracking:latest
    container_name: axis-guardian-tracking
    restart: unless-stopped
    networks:
      - axis-guardian
    environment:
      - NODE_ENV=production
      - READ_ONLY_MODE=true
      - PORT=3010
      - HOST=0.0.0.0
    volumes:
      - ./shared/config/sitemap-rectangular-room.json:/app/config/sitemap.json:ro

  camera-emulator:
    image: axis-guardian-emulator:latest
    container_name: axis-guardian-emulator
    restart: unless-stopped
    networks:
      - axis-guardian
    # WebRTC UDP ports must be exposed on host for media transport
    ports:
      - "10000-10100:10000-10100/udp"
    environment:
      - NODE_ENV=production
      - TRACKING_SERVICE_URL=http://tracking-service:3010
      - VIDEO_PATH=/app/videos
      - ANNOUNCED_IP=${VPS_PUBLIC_IP}
    depends_on:
      - tracking-service

networks:
  axis-guardian:
    name: axis-guardian-network
