###############################################
# MediaMTX Production Configuration
# Axis-Guardian Surveillance System
#
# This configuration is optimized for production deployment
# with security, monitoring, and WebRTC NAT traversal
###############################################

###############################################
# Global settings
###############################################

# Logging
logLevel: info
logDestinations: [stdout, file]
logFile: /var/log/axis-guardian/mediamtx.log

# Network timeouts
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 1024
udpMaxPayloadSize: 1472

###############################################
# Authentication
###############################################

authMethod: internal

authInternalUsers:
  # Require authentication for publishing
  - user: axis_guardian
    # Set password via environment variable or config
    pass: ${MEDIAMTX_PUBLISH_PASSWORD}
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: api
      - action: metrics

  # Allow localhost API access
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics

###############################################
# Control API
###############################################

api: yes
apiAddress: 127.0.0.1:9997
apiEncryption: no
apiAllowOrigin: '*'
apiTrustedProxies: []

###############################################
# Metrics (Prometheus)
###############################################

metrics: yes
metricsAddress: 127.0.0.1:9998
metricsEncryption: no
metricsAllowOrigin: '*'
metricsTrustedProxies: []

###############################################
# PPROF (Disabled in production)
###############################################

pprof: no

###############################################
# Playback Server (Disabled - not using recordings)
###############################################

playback: no

###############################################
# RTSP Server
###############################################

rtsp: yes
protocols: [tcp]
encryption: "no"
rtspAddress: 127.0.0.1:8554
rtspAuthMethods: [basic]

###############################################
# RTMP Server (Disabled - not using RTMP)
###############################################

rtmp: no

###############################################
# HLS Server
###############################################

hls: yes
hlsAddress: 127.0.0.1:8888
hlsEncryption: no
hlsAllowOrigin: '*'
hlsTrustedProxies: []
hlsAlwaysRemux: no
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsDirectory: ''
hlsMuxerCloseAfter: 60s

###############################################
# WebRTC Server (PRODUCTION)
###############################################

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcTrustedProxies: []

# Local UDP listener for WebRTC connections
webrtcLocalUDPAddress: :8189

# Disable TCP (UDP is more efficient for video)
webrtcLocalTCPAddress: ''

# Don't auto-gather IPs from interfaces
webrtcIPsFromInterfaces: no
webrtcIPsFromInterfacesList: []

# IMPORTANT: Set your VPS public IP here
# This tells WebRTC clients how to reach the server
webrtcAdditionalHosts: ['${VPS_PUBLIC_IP}']

# ICE servers for NAT traversal
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
    username: ''
    password: ''
    clientOnly: false

# Optional TURN server (uncomment if using)
# - url: turn:${DOMAIN}:3478
#   username: ${TURN_USERNAME}
#   password: ${TURN_PASSWORD}
#   clientOnly: false

# Timeouts
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

###############################################
# SRT Server (Disabled - not using SRT)
###############################################

srt: no

###############################################
# Default Path Settings
###############################################

pathDefaults:
  # Source
  source: publisher
  sourceOnDemand: no
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  maxReaders: 0

  # Recording (disabled for mock cameras)
  record: no

  # Publisher settings
  overridePublisher: yes

  # RTSP source settings
  rtspTransport: tcp
  rtspAnyPort: no

###############################################
# Path Settings
###############################################

paths:
  # Mock camera paths
  camera1:
    source: publisher
  camera2:
    source: publisher
  camera3:
    source: publisher
  camera4:
    source: publisher

  # Default for all other paths
  all_others:
    source: publisher
