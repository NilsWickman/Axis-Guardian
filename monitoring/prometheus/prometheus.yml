global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'axis-guardian-dev'
    environment: 'development'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # WebRTC Detection Service
  - job_name: 'axis-guardian'
    static_configs:
      - targets: ['webrtc-detection:8080']
        labels:
          service: 'webrtc-detection'
    metrics_path: '/metrics'
    scrape_interval: 5s

  # VAPIX API Simulator (if it exposes metrics)
  - job_name: 'vapix-api'
    static_configs:
      - targets: ['vapix-api:8090']
        labels:
          service: 'vapix-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    # Continue if target is down
    honor_labels: true
    params:
      format: ['prometheus']

  # MediaMTX Metrics
  - job_name: 'mediamtx'
    static_configs:
      - targets: ['mediamtx:9998']
        labels:
          service: 'mediamtx'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
