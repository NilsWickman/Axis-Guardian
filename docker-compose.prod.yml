version: '3.8'

###############################################
# Axis Guardian - Production Docker Compose
#
# Complete production stack with all services
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Services:
#   - Frontend (Nginx + Vue.js)
#   - Auth Service (Node.js + JWT)
#   - WebRTC Detection (Python + YOLOv8)
#   - MediaMTX (RTSP/WebRTC media server)
#   - PostgreSQL
#   - Redis
#   - Prometheus
#   - Grafana
###############################################

networks:
  axis-guardian:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  mediamtx_recordings:
  redis_data:

services:
  ###############################################
  # PostgreSQL Database
  ###############################################
  postgres:
    image: postgres:15-alpine
    container_name: axis-guardian-postgres
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ###############################################
  # Redis Cache/Session Store
  ###############################################
  redis:
    image: redis:7-alpine
    container_name: axis-guardian-redis
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  ###############################################
  # MediaMTX - RTSP/WebRTC Media Server
  ###############################################
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: axis-guardian-mediamtx
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "8554:8554"     # RTSP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC
      - "9997:9997"     # API
      - "9998:9998"     # Metrics
    volumes:
      - ./simulation/mediamtx/mediamtx.production.yml:/mediamtx.yml:ro
      - mediamtx_recordings:/recordings
    environment:
      MTX_PROTOCOLS: "tcp"
      MTX_LOGDESTINATIONS: "stdout"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9997/v3/config/global/get"]
      interval: 15s
      timeout: 5s
      retries: 3

  ###############################################
  # Authentication Service
  ###############################################
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: axis-guardian-auth
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

  ###############################################
  # WebRTC Detection Service
  ###############################################
  webrtc-detection:
    build:
      context: .
      dockerfile: Dockerfile.webrtc
    container_name: axis-guardian-webrtc
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "8080:8080"
    environment:
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: 8554
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD}
      REALTIME_MODEL_PATH: /app/shared/models/yolov8n.pt
    volumes:
      - ./shared/models:/app/shared/models
      - ./shared/cameras:/app/shared/cameras:ro
    depends_on:
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ###############################################
  # Frontend (Nginx + Vue.js)
  ###############################################
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: axis-guardian-frontend
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "8081:80"
    depends_on:
      - auth-service
      - webrtc-detection
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  ###############################################
  # Prometheus - Metrics Collection
  ###############################################
  prometheus:
    image: prom/prometheus:latest
    container_name: axis-guardian-prometheus
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  ###############################################
  # Grafana - Monitoring Dashboards
  ###############################################
  grafana:
    image: grafana/grafana:latest
    container_name: axis-guardian-grafana
    restart: unless-stopped
    networks:
      - axis-guardian
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

###############################################
# Production Notes:
#
# 1. Use Nginx as reverse proxy in front of services
# 2. Enable SSL/TLS with Let's Encrypt certificates
# 3. Set strong passwords in .env.production
# 4. Configure firewall to only allow necessary ports
# 5. Use Docker secrets for sensitive data (advanced)
# 6. Set up log aggregation (ELK stack or similar)
# 7. Configure backup strategy for volumes
# 8. Monitor resource usage and set limits
###############################################
