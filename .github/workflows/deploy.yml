name: Deploy Axis-Guardian Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install and build frontend
        run: |
          cd frontend && pnpm install
          VITE_TRACKING_WS_URL=wss://${{ secrets.GUARDIAN_DOMAIN }}/ws \
          VITE_TRACKING_API_URL=https://${{ secrets.GUARDIAN_DOMAIN }} \
          VITE_DEMO_MODE=true \
          pnpm run build

      - name: Install and build tracking-service
        run: cd tracking-service && pnpm install && pnpm build

      - name: Install and build camera-emulator
        run: cd camera-emulator && pnpm install && pnpm build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/frontend/

      - name: Deploy tracking-service
        run: |
          rsync -avz --delete \
            tracking-service/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/tracking-service/dist/
          rsync -avz --delete \
            tracking-service/node_modules/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/tracking-service/node_modules/
          rsync -avz \
            tracking-service/package.json \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/tracking-service/

      - name: Deploy camera-emulator
        run: |
          rsync -avz --delete \
            camera-emulator/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/camera-emulator/dist/
          rsync -avz --delete \
            camera-emulator/node_modules/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/camera-emulator/node_modules/
          rsync -avz \
            camera-emulator/package.json \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/camera-emulator/

      - name: Deploy config
        run: |
          rsync -avz \
            shared/config/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/axis-guardian/config/

      - name: Restart services
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            sudo systemctl restart tracking-service camera-emulator
            sudo systemctl reload nginx
          EOF

      - name: Purge Cloudflare Cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
