name: Deploy Axis-Guardian Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install and build frontend
        run: |
          cd frontend && pnpm install
          VITE_TRACKING_WS_URL=wss://${{ secrets.GUARDIAN_DOMAIN }}/ws \
          VITE_TRACKING_API_URL=https://${{ secrets.GUARDIAN_DOMAIN }} \
          VITE_DEMO_MODE=true \
          pnpm vite build --config config/build/vite.config.ts

      - name: Install tracking-service
        run: cd tracking-service && pnpm install

      - name: Install camera-emulator
        run: cd camera-emulator && pnpm install

      - name: Create target directories on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/axis-guardian/{frontend,tracking-service/src,camera-emulator/src,config}

      - name: Deploy frontend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'frontend/dist/*'
          target: '/opt/axis-guardian/frontend'
          strip_components: 2

      - name: Deploy tracking-service source
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'tracking-service/src/*'
          target: '/opt/axis-guardian/tracking-service/src'
          strip_components: 2

      - name: Deploy tracking-service deps
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'tracking-service/node_modules/*,tracking-service/package.json,tracking-service/tsconfig.json'
          target: '/opt/axis-guardian/tracking-service'
          strip_components: 1

      - name: Deploy camera-emulator source
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'camera-emulator/src/*'
          target: '/opt/axis-guardian/camera-emulator/src'
          strip_components: 2

      - name: Deploy camera-emulator deps
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'camera-emulator/node_modules/*,camera-emulator/package.json,camera-emulator/tsconfig.json'
          target: '/opt/axis-guardian/camera-emulator'
          strip_components: 1

      - name: Deploy config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'shared/config/*'
          target: '/opt/axis-guardian/config'
          strip_components: 2

      - name: Restart services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl restart tracking-service camera-emulator
            sudo systemctl reload nginx

      - name: Purge Cloudflare Cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
