# Nginx configuration for local HTTPS development
# This proxies HTTPS requests to the local development servers

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream servers
    # In WSL2, use the WSL2 instance IP (get via: hostname -I | awk '{print $1}')
    upstream frontend {
        server 172.25.170.150:5173;
    }

    upstream tracking {
        server 172.25.170.150:3010;
    }

    upstream camera1 {
        server 172.25.170.150:9101;
    }

    upstream camera2 {
        server 172.25.170.150:9102;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name axis.local api.axis.local camera1.axis.local camera2.axis.local;
        return 301 https://$server_name$request_uri;
    }

    # Frontend - https://axis.local
    server {
        listen 443 ssl http2;
        server_name axis.local;

        ssl_certificate     /etc/nginx/certs/axis.crt;
        ssl_certificate_key /etc/nginx/certs/axis.key;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # WebSocket support (for Vite HMR)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve original request info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for HMR
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }

    # Tracking Service API - https://api.axis.local
    server {
        listen 443 ssl http2;
        server_name api.axis.local;

        ssl_certificate     /etc/nginx/certs/axis.crt;
        ssl_certificate_key /etc/nginx/certs/axis.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass http://tracking;
            proxy_http_version 1.1;

            # WebSocket support (for tracking WebSocket)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve original request info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time updates
            proxy_buffering off;
            proxy_cache off;

            # Long timeout for WebSocket connections
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }

    # Camera Emulator 1 - https://camera1.axis.local
    server {
        listen 443 ssl http2;
        server_name camera1.axis.local;

        ssl_certificate     /etc/nginx/certs/axis.crt;
        ssl_certificate_key /etc/nginx/certs/axis.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass http://camera1;
            proxy_http_version 1.1;

            # WebSocket support (for WebRTC signaling)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve original request info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout for WebRTC connections
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }

    # Camera Emulator 2 - https://camera2.axis.local
    server {
        listen 443 ssl http2;
        server_name camera2.axis.local;

        ssl_certificate     /etc/nginx/certs/axis.crt;
        ssl_certificate_key /etc/nginx/certs/axis.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass http://camera2;
            proxy_http_version 1.1;

            # WebSocket support (for WebRTC signaling)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve original request info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout for WebRTC connections
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
