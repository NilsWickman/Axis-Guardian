services:
  # ============================================================================
  # Core Infrastructure Services (base profile)
  # ============================================================================

  # PostgreSQL Database
  postgres:
    profiles: ["base", "full", "monitoring"]
    image: postgres:15-alpine
    container_name: axis-guardian-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surveillance}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axis-guardian

  # Redis Cache
  redis:
    profiles: ["base", "full"]
    image: redis:7-alpine
    container_name: axis-guardian-redis
    command: redis-server --requirepass devpassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axis-guardian

  # MediaMTX - Real-time Media Server
  mediamtx:
    profiles: ["base", "full", "onvif"]
    image: bluenviron/mediamtx:latest
    container_name: axis-guardian-mediamtx
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"        # RTSP
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"         # HLS
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"      # WebRTC
      - "1935:1935"                                # RTMP
      - "8890:8890/udp"                            # SRT
      - "${MEDIAMTX_API_PORT:-9997}:9997"         # API
      - "${MEDIAMTX_METRICS_PORT:-9998}:9998"     # Metrics
    volumes:
      - ./simulation/mediamtx/mediamtx.custom.yml:/mediamtx.yml:ro
      - mediamtx_recordings:/recordings
    environment:
      - MTX_LOGLEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9997/v3/config/global/get"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axis-guardian
    restart: unless-stopped

  # Vue Frontend (Development)
  frontend:
    profiles: ["base", "full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: axis-guardian-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:3000
      - VITE_RTSP_PROXY_URL=http://localhost:8083
      - VITE_VAPIX_API_URL=http://localhost:8090
    networks:
      - axis-guardian
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # WebRTC Detection Service
  webrtc-detection:
    profiles: ["base", "full", "onvif"]
    build:
      context: ./simulation/webrtc-detection
      dockerfile: Dockerfile
    container_name: axis-guardian-webrtc-detection
    network_mode: "host"
    volumes:
      - ./shared/models:/app/shared/models:ro
      - ./.env:/app/.env:ro
    environment:
      - WEBRTC_DETECTION_HOST=0.0.0.0
      - WEBRTC_DETECTION_PORT=8083
      - MEDIAMTX_HOST=localhost
      - MEDIAMTX_RTSP_PORT=${MEDIAMTX_RTSP_PORT:-8554}
      - MEDIAMTX_API_PORT=${MEDIAMTX_API_PORT:-9997}
      - REALTIME_MODEL_PATH=/app/shared/models/yolov8n.pt
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - ENABLE_TRACKING=${ENABLE_TRACKING:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - mediamtx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8083/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Monitoring Services (monitoring profile)
  # ============================================================================

  # Prometheus - Metrics collection
  prometheus:
    profiles: ["monitoring", "full"]
    image: prom/prometheus:latest
    container_name: axis-guardian-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axis-guardian
    restart: unless-stopped

  # Grafana - Metrics visualization
  grafana:
    profiles: ["monitoring", "full"]
    image: grafana/grafana:latest
    container_name: axis-guardian-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axis-guardian
    depends_on:
      - prometheus
    restart: unless-stopped

  # Node Exporter - System metrics
  node-exporter:
    profiles: ["monitoring", "full"]
    image: prom/node-exporter:latest
    container_name: axis-guardian-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - axis-guardian
    restart: unless-stopped

  # ============================================================================
  # ONVIF Camera Emulators (onvif profile)
  # ============================================================================

  onvif-camera1:
    profiles: ["onvif", "full"]
    build:
      context: ./simulation/onvif-emulator
      dockerfile: Dockerfile
    container_name: onvif-camera1
    hostname: camera1
    network_mode: "host"
    # networks:
    #   axis-guardian:
    #     ipv4_address: 172.20.0.11
    # ports:
    #   - "9001:80"
    environment:
      - CAMERA_ID=camera1
      - ONVIF_HOST=0.0.0.0
      - ONVIF_PORT=9001
      - ONVIF_ENABLE_AUTH=true
      - ONVIF_USERNAME=admin
      - ONVIF_PASSWORD=axis123
      - MEDIAMTX_HOST=host.docker.internal
      - MEDIAMTX_RTSP_PORT=8554
      - MEDIAMTX_API_PORT=9997
      - RTSP_URL=rtsp://host.docker.internal:8554/camera1
      - ONVIF_EVENT_MOTION_INTERVAL=45
      - ONVIF_EVENT_OBJECT_INTERVAL=180
      - LOG_LEVEL=INFO
      - PREPROCESSED_MODE=true
      - PREPROCESSED_DIR=/data/preprocessed/1080p
      - PREPROCESSED_QUALITY=1080p
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./simulation/config/cameras.yaml:/config/cameras.yaml:ro
      - ./simulation/onvif-emulator/wsdl:/app/wsdl:ro
      - ./shared/cameras/preprocessed/1080p:/data/preprocessed/1080p:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  onvif-camera2:
    profiles: ["onvif", "full"]
    build:
      context: ./simulation/onvif-emulator
      dockerfile: Dockerfile
    container_name: onvif-camera2
    hostname: camera2
    network_mode: "host"
    # networks:
    #   axis-guardian:
    #     ipv4_address: 172.20.0.12
    # ports:
    #   - "9002:80"
    environment:
      - CAMERA_ID=camera2
      - ONVIF_HOST=0.0.0.0
      - ONVIF_PORT=9002
      - ONVIF_ENABLE_AUTH=true
      - ONVIF_USERNAME=admin
      - ONVIF_PASSWORD=axis123
      - MEDIAMTX_HOST=host.docker.internal
      - MEDIAMTX_RTSP_PORT=8554
      - MEDIAMTX_API_PORT=9997
      - RTSP_URL=rtsp://host.docker.internal:8554/camera2
      - ONVIF_EVENT_MOTION_INTERVAL=45
      - ONVIF_EVENT_OBJECT_INTERVAL=180
      - LOG_LEVEL=INFO
      - PREPROCESSED_MODE=true
      - PREPROCESSED_DIR=/data/preprocessed/1080p
      - PREPROCESSED_QUALITY=1080p
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./simulation/config/cameras.yaml:/config/cameras.yaml:ro
      - ./simulation/onvif-emulator/wsdl:/app/wsdl:ro
      - ./shared/cameras/preprocessed/1080p:/data/preprocessed/1080p:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 3D Site Map Generator (sitemap3d profile)
  # ============================================================================

  sitemap-generator:
    profiles: ["sitemap3d", "full"]
    build:
      context: ./simulation/site-map-generator
      dockerfile: Dockerfile
    container_name: axis-sitemap-generator
    ports:
      - "${SITE_MAP_GEN_PORT:-8081}:8081"
    volumes:
      - ./shared/cameras:/app/cameras:ro
      - ./frontend/public/site-maps:/app/output:rw
      - sitemap_models:/app/models
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8081
      - CAMERAS_DIR=/app/cameras
      - OUTPUT_DIR=/app/output
      - MODELS_DIR=/app/models
      - DEPTH_MODEL=${DEPTH_MODEL:-MiDaS_small}
      - DEPTH_DEVICE=${DEPTH_DEVICE:-cpu}
      - SITE_MAP_FRAME_SAMPLE_RATE=${SITE_MAP_FRAME_SAMPLE_RATE:-30}
      - MIN_DEPTH=${MIN_DEPTH:-0.1}
      - MAX_DEPTH=${MAX_DEPTH:-50.0}
      - RANSAC_THRESHOLD=${RANSAC_THRESHOLD:-0.1}
      - MIN_PLANE_POINTS=${MIN_PLANE_POINTS:-1000}
      - DEFAULT_FOV=${DEFAULT_FOV:-60.0}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-3.0}
    restart: unless-stopped
    networks:
      - axis-guardian
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: axis-guardian_postgres_data
  redis_data:
    name: axis-guardian_redis_data
  mediamtx_recordings:
    name: axis-guardian_mediamtx_recordings
  prometheus_data:
    name: axis-guardian_prometheus_data
  grafana_data:
    name: axis-guardian_grafana_data
  sitemap_models:
    name: axis-guardian_sitemap_models

networks:
  axis-guardian:
    name: axis-guardian-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
