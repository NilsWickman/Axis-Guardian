name: Deploy Axis-Guardian Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install and build frontend
        run: |
          cd frontend && pnpm install
          VITE_TRACKING_WS_URL=wss://${{ secrets.GUARDIAN_DOMAIN }}/ws \
          VITE_TRACKING_API_URL=https://${{ secrets.GUARDIAN_DOMAIN }} \
          VITE_CAMERA1_WEBRTC_URL=wss://${{ secrets.GUARDIAN_DOMAIN }}/cam1 \
          VITE_CAMERA2_WEBRTC_URL=wss://${{ secrets.GUARDIAN_DOMAIN }}/cam2 \
          VITE_HLS_BASE_URL=https://${{ secrets.GUARDIAN_DOMAIN }}/hls \
          VITE_USE_MOCK_DATA=false \
          VITE_DEMO_MODE=true \
          pnpm vite build --config config/build/vite.config.ts

      - name: Deploy frontend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'frontend/dist/*'
          target: '/opt/axis-guardian/frontend'
          strip_components: 2

      - name: Deploy tracking-service source
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'tracking-service/src/*'
          target: '/opt/axis-guardian/tracking-service/src'
          strip_components: 2

      - name: Deploy tracking-service config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'tracking-service/package.json,tracking-service/tsconfig.json'
          target: '/opt/axis-guardian/tracking-service'
          strip_components: 1

      - name: Deploy camera-emulator source
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'camera-emulator/src/*'
          target: '/opt/axis-guardian/camera-emulator/src'
          strip_components: 2

      - name: Deploy camera-emulator config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'camera-emulator/package.json,camera-emulator/tsconfig.json'
          target: '/opt/axis-guardian/camera-emulator'
          strip_components: 1

      - name: Deploy nginx config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'deploy/nginx-site.conf'
          target: '/opt/axis-guardian/deploy'
          strip_components: 1

      - name: Install and restart services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Update nginx config (includes WebSocket hardening)
            sed "s/GUARDIAN_DOMAIN_PLACEHOLDER/${{ secrets.GUARDIAN_DOMAIN }}/g" /opt/axis-guardian/deploy/nginx-site.conf | sudo tee /etc/nginx/sites-available/axis-guardian > /dev/null
            sudo ln -sf /etc/nginx/sites-available/axis-guardian /etc/nginx/sites-enabled/
            sudo nginx -t
            sudo systemctl reload nginx

            mkdir -p /opt/axis-guardian/frontend/public
            cp /opt/axis-guardian/frontend/sitemap-rectangular-room.json /opt/axis-guardian/frontend/public/

            cd /opt/axis-guardian/tracking-service
            npm install
            npx pm2 delete axis-tracking 2>/dev/null || true
            npx pm2 start "npx tsx src/index.ts" --name axis-tracking --cwd /opt/axis-guardian/tracking-service

            cd /opt/axis-guardian/camera-emulator
            npm install
            npx pm2 delete axis-emulator 2>/dev/null || true
            VIDEO_PATH=/opt/axis-guardian/videos \
            ANNOUNCED_IP=${{ secrets.VPS_HOST }} \
            npx pm2 start "npx tsx src/index.ts" --name axis-emulator --cwd /opt/axis-guardian/camera-emulator

            npx pm2 save

      - name: Purge Cloudflare Cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      - name: Wait for services to start
        run: sleep 10

      - name: Check tracking service health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://${{ secrets.GUARDIAN_DOMAIN }}/api/health || echo "000")
          if [ "$response" != "200" ]; then
            echo "Tracking service health check failed with status: $response"
            exit 1
          fi
          echo "Tracking service is healthy"

      - name: Check frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://${{ secrets.GUARDIAN_DOMAIN }}/ || echo "000")
          if [ "$response" != "200" ]; then
            echo "Frontend check failed with status: $response"
            exit 1
          fi
          echo "Frontend is accessible"
