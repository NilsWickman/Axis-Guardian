# Auditorium site configuration based on scene_metadata.xml

cameras:
  - id: camera1  # view-HC3
    # Convert local coordinates to fake GPS (using Duke campus area as reference)
    # In reality, would use actual building GPS coordinates
    # Local position: (16.22, 0.3, 1.68) meters
    gps: [35.99400, -78.90180, 120.5]  # Fake GPS for reference point
    mount_height: 1.68  # z coordinate from metadata
    orientation:
      pan: 18.0      # Azimuth from metadata
      tilt: 1.0      # Elevation from metadata (looking slightly up)
      roll: 0.0
    intrinsics:
      focal_length: 4.0
      sensor_size: [0.357, 0.357]  # 1/2.8" sensor
      resolution: [1920, 1080]
      fov: [92.0, 50.0]
    image_path: "sample_images/camera1.jpg"
    # Real local position for reference
    local_position: [16.22, 0.3, 1.68]

  - id: camera2  # view-HC4
    # Local position: (0.9, 0.5, 1.67) meters
    gps: [35.99399, -78.90195, 120.49]
    mount_height: 1.67
    orientation:
      pan: 313.0     # Azimuth (NW direction)
      tilt: -5.0     # Elevation (looking down 5 degrees)
      roll: 0.0
    intrinsics:
      focal_length: 4.0
      sensor_size: [0.357, 0.357]
      resolution: [1920, 1080]
      fov: [92.0, 50.0]
    image_path: "sample_images/camera2.jpg"
    local_position: [0.9, 0.5, 1.67]

  - id: camera3  # view-IP2
    # Local position: (20.60, 28.31, 2.62) meters
    gps: [35.99425, -78.90178, 121.44]
    mount_height: 2.62
    orientation:
      pan: 140.0     # Azimuth (SE direction)
      tilt: -9.0     # Elevation (looking down 9 degrees)
      roll: 0.0
    intrinsics:
      focal_length: 4.0
      sensor_size: [0.357, 0.357]
      resolution: [1920, 1080]
      fov: [92.0, 50.0]
    image_path: "sample_images/camera3.jpg"
    local_position: [20.60, 28.31, 2.62]

  - id: camera4  # view-IP5
    # Local position: (10.57, 16.31, 1.84) meters
    gps: [35.99415, -78.90186, 120.66]
    mount_height: 1.84
    orientation:
      pan: 339.0     # Azimuth (NNW direction)
      tilt: 0.0      # Elevation (looking at horizon)
      roll: 0.0
    intrinsics:
      focal_length: 4.0
      sensor_size: [0.357, 0.357]
      resolution: [1920, 1080]
      fov: [92.0, 50.0]
    image_path: "sample_images/camera4.jpg"
    local_position: [10.57, 16.31, 1.84]

generation:
  grid_resolution: 0.1          # 10cm cells
  min_wall_length: 0.3          # Smaller threshold for indoor
  confidence_threshold: 0.3      # Lower threshold for indoor scenes
  semantic_model: "nvidia/segformer-b0-finetuned-ade-512-512"  # Fastest model

# Note: GPS coordinates are approximated from local coordinates
# In production, you would:
# 1. Get the building's GPS coordinates
# 2. Apply local offsets to get each camera's GPS position
# 3. Or use the local coordinates directly with a different coordinate system
