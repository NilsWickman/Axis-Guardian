# Axis-Guardian nginx site configuration
# Deployed by GitHub Actions - domain placeholder replaced via sed
#
# Manual setup: certbot certonly --nginx -d YOUR_DOMAIN

upstream guardian_api {
    server 127.0.0.1:3010;
}

upstream guardian_cam1 {
    server 127.0.0.1:9101;
}

upstream guardian_cam2 {
    server 127.0.0.1:9102;
}

# Basic DoS protection for WebSocket handshakes
# (this file is included inside nginx `http {}` so these directives are valid here)
limit_conn_zone $binary_remote_addr zone=guardian_ws_conn:10m;
limit_req_zone $binary_remote_addr zone=guardian_ws_req:10m rate=10r/s;

server {
    listen 80;
    server_name GUARDIAN_DOMAIN_PLACEHOLDER;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name GUARDIAN_DOMAIN_PLACEHOLDER;

    # Request/header hardening (covers WS upgrade handshakes too)
    client_max_body_size 1m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/GUARDIAN_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/GUARDIAN_DOMAIN_PLACEHOLDER/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Logging
    access_log /var/log/nginx/axis-guardian.access.log;
    error_log /var/log/nginx/axis-guardian.error.log;

    # API routes
    location /api/ {
        proxy_pass http://guardian_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket for tracking service
    location /ws {
        proxy_pass http://guardian_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 60s;

        limit_conn guardian_ws_conn 20;
        limit_req zone=guardian_ws_req burst=20 nodelay;
    }

    # Camera 1 WebRTC signaling
    location /cam1/ {
        rewrite ^/cam1/(.*) /$1 break;
        proxy_pass http://guardian_cam1;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 60s;

        limit_conn guardian_ws_conn 20;
        limit_req zone=guardian_ws_req burst=20 nodelay;
    }

    # Camera 2 WebRTC signaling
    location /cam2/ {
        rewrite ^/cam2/(.*) /$1 break;
        proxy_pass http://guardian_cam2;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 60s;

        limit_conn guardian_ws_conn 20;
        limit_req zone=guardian_ws_req burst=20 nodelay;
    }

    # MediaMTX HLS streams (proxied over HTTPS to avoid mixed-content on iOS/Safari)
    # Frontend should use VITE_HLS_BASE_URL=https://<domain>/hls
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # Frontend - serve static files directly
    location / {
        root /opt/axis-guardian/frontend;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
